name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neucine/neiv
          ref: dd55c0c151206c14fb104cb7928fc52ef5f48928
          path: target/neiv
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: target/neiv/packages/neiv/package-lock.json
      - name: Install pinned Cyna LLVM dependency
        run: |
          archive="$RUNNER_TEMP/z3-4.15.4-arm64-osx.zip"
          curl -fsSL \
            https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-arm64-osx-13.7.6.zip \
            -o "$archive"
          echo "8bb3439772cafd75240d61abf255e89122850bab93563d1283b048359ab4e88f  $archive" \
            | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/cyna-z3"
          install -d /opt/homebrew/opt/z3/lib
          install -m 0555 \
            "$RUNNER_TEMP/cyna-z3/z3-4.15.4-arm64-osx-13.7.6/bin/libz3.dylib" \
            /opt/homebrew/opt/z3/lib/libz3.4.15.dylib
      - name: Install Cyna 0.5.3
        run: |
          export HOME="${RUNNER_TEMP}/cyna-home"
          mkdir -p "$HOME"
          export CYNA_INSTALL_ROOT="$HOME/.cyna"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          sh -c 'curl -fsSL https://cyna.dev/install.sh | sh -s -- 0.5.3 aarch64-apple-darwin'
          echo "$CYNA_INSTALL_ROOT/current/bin" >> "$GITHUB_PATH"
      - name: Link installed Cyna
        run: scripts/setup-installed-cyna.sh
      - name: Install pinned Neiv dependencies
        run: npm ci --prefix target/neiv/packages/neiv --ignore-scripts --no-audit --no-fund
      - name: Check native boundaries
        run: scripts/check-boundaries.sh
      - name: Check and test Cyna source
        run: |
          target/cyna-toolchain/cyna/zig-out/bin/cyna fmt src ui --check
          target/cyna-toolchain/cyna/zig-out/bin/cyna check .
          python3 scripts/test-cyna-native.py
      - name: Test qualification tools
        run: |
          python3 scripts/test-compare-camera-chart.py
          python3 scripts/test_analyze_camera_render.py
          python3 scripts/test_compare_native_precision.py
      - name: Build native app
        env:
          LIGHTCEPT_NEIV_CLI: ${{ github.workspace }}/target/neiv/packages/neiv/bin/neiv.mjs
        run: ui/neiv/build.sh
